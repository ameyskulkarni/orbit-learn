[project]
name = "orbit-learn"
version = "0.1.0"
description = "Adaptive daily learning engine — provider-agnostic, config-driven, prompt-file-swappable."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [{ name = "Orbit Contributors" }]
dependencies = [
    "litellm>=1.40",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
email = ["resend>=2.0"]

[project.scripts]
orbit = "src.cli:app"

# --- Poetry-specific config ---
# Poetry 2.x reads dependencies from [project] above and adds tooling on top.

[tool.poetry]
# The package lives in src/ but is imported as `src` (see main.py: `from src.config import ...`).
# When we start distributing on PyPI (Phase 5) we'll rename to a proper `orbit` package.
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.5"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
